[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahrt-stage-a"
version = "0.1.0"
description = "AHRT Stage A photon transport and Klein-Nishina reference prototype"
requires-python = ">=3.11"
authors = [{name = "AHRT project"}]
dependencies = []

[project.scripts]
acht = "ahrt_stage_a.cli:main"
ahrt = "ahrt_stage_a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
